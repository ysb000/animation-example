<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KFC</title>
    <link rel="stylesheet" href="reset.css">
    <style>
        body, html {background:#da1e27;}
        header, main {width:1400px; margin:0 auto;}
        header {padding:30px 0;}
        header img {width:100%;}
        main {height:800px; position:relative; display:flex; justify-content:space-between; padding:50px 0 0;}
        main .txt #order {
            background:#fff; border-radius:50px; text-align:center; padding:20px 0;
            display:inline-block; margin-top:50px; font-weight:600;
            width:200px; color:#000;
            transition:
            width 0.5s,
            color 0.2s;
        }
        main .txt #order:hover {
            color:#da1e27;
            width:250px;
            box-shadow:0 0 10px rgba(255,255,255,0.5);
        }
        #sns {position:absolute; left:0; bottom:100px;}
        #sns a {
            display:inline-block; width:40px; margin:0 10px;
            position:relative; top:0;
        }
        #sns a img {width:100%; transition:transform 0.3s;}
        #sns a:hover img {transform: translateY(-26px);}
        #dynamic #big {position:relative; z-index: 100;}
        #dynamic #btn {display:flex; position:absolute; right:0; bottom:100px; z-index:20;}
        #dynamic #btn a {margin:0 5px;}
        #dynamic #btn a#prev {}
        #dynamic #btn a#next {transform:scaleX(-1);}
    </style>
    <script>
        window.onload=function(){
            //이전 누르면 메뉴2
            //다음 누르면 메뉴3
            /* 변수 */
            const prevBtn = document.querySelector('#prev');
            const nextBtn = document.querySelector('#next');
            const dynamicImg = document.querySelector('#big');
            console.log(prevBtn, nextBtn, dynamicImg);
            /* 이벤트 */
            prevBtn.addEventListener('click', prevImg);
            nextBtn.addEventListener('click', nextImg);
            /* 함수 */
            function prevImg() {
                dynamicImg.src = './images/menu2.png';
            }
            function nextImg() {
                dynamicImg.src = './images/menu3.png';
            }
        }//e:onload
    </script>
</head>
<body>
    <div id="wrap">
        <header><img src="images/kfc_header.png" alt=""></header>
        <main>
            <div class="txt">
                <p><img src="images/sub_title.png" alt=""></p>
                <a href="#" id="order">Order Now</a>
            </div>
            <div id="sns">
                <a href="#"><img src="images/facebook.png" alt=""></a>
                <a href="#"><img src="images/twitter.png" alt=""></a>
                <a href="#"><img src="images/instagram.png" alt=""></a>
            </div>
            <div id="dynamic">
                <div id="img">
                    <img src="images/menu1.png" alt="" id="big">
                </div>
                <div id="btn">
                    <a href="#" id="prev"><img src="images/prev_next.png" alt=""></a>
                    <a href="#" id="next"><img src="images/prev_next.png" alt=""></a>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
